# The example app: `xcodegen generate` here (and Example/scripts/fetch-pictures.sh for photos to edit), then open
# HangarExample.xcodeproj.
name: HangarExample
options:
  bundleIdPrefix: dev.hangar
  deploymentTarget:
    iOS: "17.0"
packages:
  Hangar:
    path: ..
  Flight:
    url: https://github.com/Eirperuier/Flight.git
    from: 0.7.23
targets:
  HangarExample:
    type: application
    platform: iOS
    sources:
      - path: HangarExample
      - path: Pictures
        type: folder
        optional: true
    dependencies:
      - package: Hangar
        product: Hangar
      - package: Flight
        product: ImagePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hangar.example
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HangarExample/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hangar
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
